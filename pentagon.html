<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Art Gallery Problem Visualization</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  svg { border: 1px solid #ccc; background-color: #f9f9f9; }
  .info { margin-top: 20px; padding: 10px; background-color: #f0f0f0; }
</style>
</head>
<body>
<h1>Art Gallery Problem - Triangulation & Guard Placement</h1>
<svg width="280.902" height="290.211">
<defs>
  <style>
    .polygon-edge { stroke: #000; stroke-width: 2.5; fill: none; }
    .diagonal { stroke: #999; stroke-width: 1.5; fill: none; stroke-dasharray: 5,5; opacity: 0.7; }
    .vertex { fill: #333 !important; stroke: #000 !important; stroke-width: 1.5 !important; }
    .vertex-red { }
    .vertex-green { }
    .vertex-blue { }
    .guard-marker { }
    .vertex-label { font-size: 12px; fill: black; font-weight: bold; font-family: Arial; text-shadow: 1px 1px 2px white; }
  </style>
</defs>
<!-- Triangulation Diagonals -->
<line x1="161.803" y1="240.211" x2="230.902" y2="145.106" class="diagonal"/>
<line x1="230.902" y1="145.106" x2="161.803" y2="50" class="diagonal"/>
<line x1="161.803" y1="50" x2="161.803" y2="240.211" class="diagonal"/>
<!-- Triangle with colors: Red, Green, Blue -->
<line x1="161.803" y1="240.211" x2="161.803" y2="50" class="diagonal"/>
<line x1="161.803" y1="50" x2="50" y2="86.3271" class="diagonal"/>
<line x1="50" y1="86.3271" x2="161.803" y2="240.211" class="diagonal"/>
<!-- Triangle with colors: Red, Blue, Green -->
<line x1="50" y1="86.3271" x2="50" y2="203.884" class="diagonal"/>
<line x1="50" y1="203.884" x2="161.803" y2="240.211" class="diagonal"/>
<line x1="161.803" y1="240.211" x2="50" y2="86.3271" class="diagonal"/>
<!-- Triangle with colors: Green, Blue, Red -->
<!-- Polygon Edges -->
<line x1="230.902" y1="145.106" x2="161.803" y2="50" class="polygon-edge"/>
<line x1="161.803" y1="50" x2="50" y2="86.3271" class="polygon-edge"/>
<line x1="50" y1="86.3271" x2="50" y2="203.884" class="polygon-edge"/>
<line x1="50" y1="203.884" x2="161.803" y2="240.211" class="polygon-edge"/>
<line x1="161.803" y1="240.211" x2="230.902" y2="145.106" class="polygon-edge"/>
<!-- Vertices -->
<circle cx="230.902" cy="145.106" r="8" fill="#00CC00" stroke="#009900" stroke-width="2.5" class="vertex-green" style="filter: drop-shadow(0 0 2px rgba(0,0,0,0.3));"/>
<text x="244.902" y="150.106" class="vertex-label" font-weight="bold">0</text>
<circle cx="161.803" cy="50" r="8" fill="#0066FF" stroke="#003399" stroke-width="2.5" class="vertex-blue" style="filter: drop-shadow(0 0 2px rgba(0,0,0,0.3));"/>
<text x="175.803" y="55" class="vertex-label" font-weight="bold">1</text>
<circle cx="50" cy="86.3271" r="8" fill="#00CC00" stroke="#009900" stroke-width="2.5" class="vertex-green" style="filter: drop-shadow(0 0 2px rgba(0,0,0,0.3));"/>
<text x="64" y="91.3271" class="vertex-label" font-weight="bold">2</text>
<circle cx="50" cy="203.884" r="8" fill="#0066FF" stroke="#003399" stroke-width="2.5" class="vertex-blue" style="filter: drop-shadow(0 0 2px rgba(0,0,0,0.3));"/>
<text x="64" y="208.884" class="vertex-label" font-weight="bold">3</text>
<rect x="151.803" y="230.211" width="20" height="20" fill="none" stroke="#FF4500" stroke-width="3" rx="2" style="filter: drop-shadow(0 0 2px rgba(255,100,0,0.3));"/>

<text x="175.803" y="245.211" class="vertex-label" font-weight="bold">4</text>

<rect x="151.803" y="230.211" width="20" height="20" fill="none" stroke="#FF4500" stroke-width="2" class="guard-marker"/>
</svg>
